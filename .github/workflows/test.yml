name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rotate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      # tmux: 画面の組み立てそのもの / jq: 状態ファイル / fzf: リストペインが起動時に要求する
      - name: 依存を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux jq fzf ncurses-bin

      - name: 構文チェック
        run: |
          for f in bin/deck bin/deck-list lib/core.zsh hooks/deck-claude-status.sh install.sh tests/rotate-test.zsh; do
            zsh -n "$f" || exit 1
          done

      # 使い捨ての tmux サーバと状態ディレクトリで走るので、後片付けは不要
      - name: 玉突き・状態判定のテスト
        run: zsh tests/rotate-test.zsh
