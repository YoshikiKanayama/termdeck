# termdeck が快適に動くための最小 tmux 設定（2026-08-03）
# 既に自分の ~/.tmux.conf を持っている場合は、足りない項目だけ取り込めばいい。
# install.sh --with-tmux で ~/.tmux.conf から source される。

# マウス操作（クリックでペイン切替・境界ドラッグでリサイズ・ホイールでスクロール）
set -g mouse on

# Claude Code の TUI 用: Esc の遅延ゼロ + 24bit カラー
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# スクロールバックは長めに（エージェントの出力は流れるのが速い）
set -g history-limit 50000

# どのペインがアクティブか一目で分かるように
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39,bold"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour39],#[fg=colour245]}#{?@deck_slot,#{@deck_slot}: ,}#{pane_title} "
